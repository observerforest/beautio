name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install pnpm
        run: npm install --global pnpm@11.1.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Build production web assets
        run: pnpm build

  container:
    name: Build production container
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image without publishing it
        run: >-
          docker build
          --label com.beautio.source.revision=${{ github.sha }}
          --tag beautio-ci:${{ github.sha }}
          .

      - name: Export manually requested deployment image
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          image="beautio-ci:${GITHUB_SHA}"
          archive="beautio-${GITHUB_SHA}.tar.gz"
          docker image inspect --format '{{.Id}}' "$image" > beautio-image-id.txt
          docker save "$image" | gzip -1 > "$archive"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload manually requested deployment image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: beautio-image-${{ github.sha }}
          path: |
            beautio-${{ github.sha }}.tar.gz
            beautio-${{ github.sha }}.tar.gz.sha256
            beautio-image-id.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
